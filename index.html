<!DOCTYPE html>
<html lang="id">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <meta name="robots" content="noindex, nofollow">
    <title>CLQ Mamuju — Mengalihkan…</title>
    <style>
        * { margin: 0; padding: 0; box-sizing: border-box; }
        body {
            font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif;
            background: #f8fafc;
            min-height: 100vh;
            display: flex;
            align-items: center;
            justify-content: center;
            padding: 24px;
        }
        .kartu {
            background: #fff;
            border-radius: 16px;
            box-shadow: 0 10px 30px rgba(0, 0, 0, 0.08);
            padding: 40px 32px;
            max-width: 420px;
            width: 100%;
            text-align: center;
        }
        .logo { font-size: 13px; font-weight: 700; color: #00529C; letter-spacing: 0.15em; margin-bottom: 24px; }
        .spinner {
            width: 44px; height: 44px; margin: 0 auto 20px;
            border: 4px solid #e2e8f0;
            border-top-color: #00529C;
            border-radius: 50%;
            animation: putar 0.8s linear infinite;
        }
        @keyframes putar { to { transform: rotate(360deg); } }
        h1 { font-size: 18px; color: #1e293b; margin-bottom: 8px; }
        p { font-size: 14px; color: #64748b; line-height: 1.6; }
        .tombol {
            display: inline-block; margin-top: 24px; padding: 12px 24px;
            background: #00529C; color: #fff; text-decoration: none;
            border-radius: 10px; font-weight: 600; font-size: 14px;
        }
        .catatan { margin-top: 20px; font-size: 12px; color: #94a3b8; word-break: break-all; }
    </style>
</head>
<body>
    <div class="kartu">
        <div class="logo">CLQ MAMUJU</div>
        <div class="spinner"></div>
        <h1>Membuka aplikasi…</h1>
        <p>Anda sedang diarahkan ke aplikasi CLQ yang baru.</p>

        <a id="tombol-manual" class="tombol" href="https://clq-portal.colekdek244.workers.dev" style="display:none">
            Buka aplikasi
        </a>

        <div class="catatan">Simpan alamat baru:<br>clq-portal.colekdek244.workers.dev</div>
    </div>

    <script>
        // ============================================================================
        // clqmenu sekarang HANYA MENGALIHKAN ke aplikasi utama (clq-portal).
        //
        // SEBELUMNYA halaman ini menyusun menu sendiri lalu memanggil 3 aplikasi
        // terpisah lewat iframe:
        //   - clqadmin.colekdek244.workers.dev   (dashboard)
        //   - Apps Script /exec                  (update rindeb & update bayar)
        //   - clqmonitor.colekdek244.workers.dev (monitor peta)
        //
        // Cara itu bermasalah: pekerjaan dua kali (menu lalu aplikasi), cookie
        // login tidak terbawa di dalam iframe karena domainnya berbeda, dan kalau
        // salah satu aplikasi error halamannya kosong tanpa penjelasan apa pun.
        //
        // Semua tujuan menu itu sekarang SUDAH ADA di dalam clq-portal beserta
        // sidebar-nya: dashboard, rindeb, bayar, monitor, distribusi, laporan,
        // pindah, pembatalan, dan users. Jadi lapisan menu di sini tidak perlu lagi.
        //
        // Halaman ini dipertahankan supaya alamat lama clqmenu.vercel.app tetap
        // hidup, sehingga petugas yang sudah hafal alamat itu langsung sampai ke
        // aplikasi baru tanpa harus belajar alamat baru.
        // ============================================================================

        var TUJUAN = 'https://clq-portal.colekdek244.workers.dev';

        // Padanan nama menu -> alamat di clq-portal.
        //
        // PENTING: kunci di bawah ini SENGAJA memuat dua gaya penulisan, 'rindeb'
        // dan 'updaterindeb'. Alamat lama memakai ?page=UpdateRindeb sementara
        // alamat baru cukup ?page=rindeb. Normalisasi toLowerCase() saja TIDAK
        // cukup: "updaterindeb" tidak sama dengan "rindeb", sehingga alamat lama
        // akan mendarat di halaman utama alih-alih halaman yang diminta.
        var PETA = {
            'beranda':      '/beranda',
            'dashboard':    '/dashboard',
            'rindeb':       '/rindeb',
            'updaterindeb': '/rindeb',
            'bayar':        '/bayar',
            'updatebayar':  '/bayar',
            'monitor':      '/monitor',
            'monitorlive':  '/monitor',
            'distribusi':   '/distribusi',
            'laporan':      '/laporan',
            'pindah':       '/pindah',
            'pembatalan':   '/pembatalan',
            'users':        '/users'
        };

        (function () {
            var diminta = new URLSearchParams(location.search).get('page');
            var tujuan = TUJUAN;

            if (diminta) {
                // buang semua yang bukan huruf supaya "Update_Rindeb" atau
                // "update-rindeb" tetap terbaca
                var kunci = String(diminta).toLowerCase().replace(/[^a-z]/g, '');
                if (PETA[kunci]) tujuan = TUJUAN + PETA[kunci];
            }

            // location.replace (bukan href) supaya halaman ini TIDAK masuk riwayat
            // browser. Dengan href, tombol "kembali" petugas akan mendarat di sini
            // lalu langsung dialihkan lagi — terasa seperti halaman yang tidak bisa
            // ditinggalkan.
            location.replace(tujuan);
        })();

        // Munculkan tombol manual kalau pengalihan otomatis diblokir (mis. JavaScript
        // dimatikan atau ekstensi memblokir). Lebih baik ada jalan keluar daripada
        // layar yang berputar selamanya — masalah yang ada di versi lama.
        window.addEventListener('load', function () {
            setTimeout(function () {
                var t = document.getElementById('tombol-manual');
                if (t) t.style.display = 'inline-block';
            }, 1500);
        });
    </script>
</body>
</html>
